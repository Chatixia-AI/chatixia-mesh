version: 2
# Minor and patch updates arrive as one grouped PR per ecosystem each week.
# Major updates still come one per PR so each can be reviewed on its own;
# for the WebRTC and auth crates (webrtc, jsonwebtoken), wait for the
# two-sidecar integration test (CI job `integration`) to pass before merging.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(rust):"
    groups:
      rust-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /hub
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(hub):"
    groups:
      hub-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: pip
    directory: /agent
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(agent):"
    groups:
      agent-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(ci):"
    groups:
      actions:
        patterns: ["*"]
